image: maven:3.9.9-eclipse-temurin-21

stages:
  - build
  - docker
  - deploy

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  CONTAINER_NAME: "springboot-app"
  HOST_PORT: "8080"
  CONTAINER_PORT: "8080"

  AWS_EC2_METADATA_DISABLED: "false"
  AWS_METADATA_SERVICE_TIMEOUT: "5"
  AWS_METADATA_SERVICE_NUM_ATTEMPTS: "3"

# =========================================================
# BUILD MAVEN APPLICATION
# =========================================================
build:
  stage: build

  tags:
    - docker

  script:
    - echo "Building Spring Boot application..."
    - mvn clean package

  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# =========================================================
# BUILD DOCKER IMAGE AND PUSH TO AWS ECR
# =========================================================
docker-build-push:
  stage: docker
  image: docker:28

  tags:
    - docker

  needs:
    - job: build
      artifacts: true

  before_script:
    - apk add --no-cache aws-cli curl

    - |
      if [ -z "${AWS_ACCOUNT_ID:-}" ]; then
        echo "ERROR: AWS_ACCOUNT_ID variable is missing"
        exit 1
      fi

    - |
      if [ -z "${AWS_DEFAULT_REGION:-}" ]; then
        echo "ERROR: AWS_DEFAULT_REGION variable is missing"
        exit 1
      fi

    - |
      if [ -z "${ECR_REPOSITORY:-}" ]; then
        echo "ERROR: ECR_REPOSITORY variable is missing"
        exit 1
      fi

    - echo "Checking GitLab Runner IAM Role..."
    - aws sts get-caller-identity

    - echo "Checking Docker..."
    - docker version

  script:
    - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - export ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

    - echo "Docker image is ${ECR_IMAGE}"

    - echo "Building Docker image..."
    - docker build -t "${ECR_IMAGE}" .

    - echo "Logging in to Amazon ECR..."
    - |
      aws ecr get-login-password \
        --region "${AWS_DEFAULT_REGION}" |
      docker login \
        --username AWS \
        --password-stdin "${ECR_REGISTRY}"

    - echo "Pushing Docker image to ECR..."
    - docker push "${ECR_IMAGE}"

    - echo "Docker image pushed successfully"
    - echo "${ECR_IMAGE}"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# =========================================================
# DEPLOY IMAGE ON TERRAFORM-CREATED EC2
# =========================================================
deploy-to-ec2:
  stage: deploy
  image: alpine:3.22

  tags:
    - docker

  needs:
    - job: docker-build-push
      artifacts: false

  before_script:
    - apk add --no-cache openssh-client

    - |
      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "ERROR: SSH_PRIVATE_KEY variable is missing"
        exit 1
      fi

    - |
      if [ ! -f "${SSH_PRIVATE_KEY}" ]; then
        echo "ERROR: SSH_PRIVATE_KEY must be a File-type GitLab variable"
        exit 1
      fi

    - |
      if [ -z "${TARGET_EC2_IP:-}" ]; then
        echo "ERROR: TARGET_EC2_IP variable is missing"
        exit 1
      fi

    - chmod 600 "${SSH_PRIVATE_KEY}"

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - echo "Adding EC2 host key..."
    - ssh-keyscan -H "${TARGET_EC2_IP}" >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

  script:
    - echo "Deploying image tag ${IMAGE_TAG} to EC2 ${TARGET_EC2_IP}..."

    - |
      ssh \
        -i "${SSH_PRIVATE_KEY}" \
        -o BatchMode=yes \
        -o ConnectTimeout=30 \
        "ubuntu@${TARGET_EC2_IP}" \
        "mkdir -p /home/ubuntu/deployment"

    - |
      scp \
        -i "${SSH_PRIVATE_KEY}" \
        -o BatchMode=yes \
        -o ConnectTimeout=30 \
        deploy.sh \
        "ubuntu@${TARGET_EC2_IP}:/home/ubuntu/deployment/deploy.sh"

    - |
      ssh \
        -i "${SSH_PRIVATE_KEY}" \
        -o BatchMode=yes \
        -o ConnectTimeout=30 \
        "ubuntu@${TARGET_EC2_IP}" \
        "
          chmod +x /home/ubuntu/deployment/deploy.sh &&
          sudo \
          AWS_ACCOUNT_ID='${AWS_ACCOUNT_ID}' \
          AWS_DEFAULT_REGION='${AWS_DEFAULT_REGION}' \
          ECR_REPOSITORY='${ECR_REPOSITORY}' \
          IMAGE_TAG='${IMAGE_TAG}' \
          CONTAINER_NAME='${CONTAINER_NAME}' \
          HOST_PORT='${HOST_PORT}' \
          CONTAINER_PORT='${CONTAINER_PORT}' \
          /home/ubuntu/deployment/deploy.sh
        "

    - echo "Deployment completed successfully"

  environment:
    name: production
    url: "http://${TARGET_EC2_IP}:8080"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'