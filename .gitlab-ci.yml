image: maven:3.9.9-eclipse-temurin-21

stages:
  - build
  - docker
  - deploy

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  AWS_EC2_METADATA_DISABLED: "false"
  AWS_METADATA_SERVICE_TIMEOUT: "5"
  AWS_METADATA_SERVICE_NUM_ATTEMPTS: "3"

build:
  stage: build

  tags:
    - docker

  script:
    - echo "Building Maven application..."
    - mvn clean package

  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

docker-build-push:
  stage: docker
  image: docker:28

  tags:
    - docker

  needs:
    - job: build
      artifacts: true

  before_script:
    - apk add --no-cache aws-cli curl
    - aws sts get-caller-identity
    - docker version

  script:
    - export ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - export ECR_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

    - echo "Building Docker image..."
    - docker build --tag "$ECR_IMAGE" .

    - echo "Logging in to ECR..."
    - |
      aws ecr get-login-password \
        --region "$AWS_DEFAULT_REGION" |
      docker login \
        --username AWS \
        --password-stdin "$ECR_REGISTRY"

    - echo "Pushing image..."
    - docker push "$ECR_IMAGE"

    - echo "Image pushed successfully:"
    - echo "$ECR_IMAGE"

deploy-to-ec2:
  stage: deploy
  image: alpine:3.22

  tags:
    - docker

  needs:
    - docker-build-push

  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"

  script:
    - echo "Deploying image tag $IMAGE_TAG to EC2..."

    - |
      ssh \
        -i "$SSH_PRIVATE_KEY" \
        -o StrictHostKeyChecking=no \
        "ubuntu@$TARGET_EC2_IP" \
        "mkdir -p /home/ubuntu/deployment"

    - |
      scp \
        -i "$SSH_PRIVATE_KEY" \
        -o StrictHostKeyChecking=no \
        deploy.sh \
        "ubuntu@$TARGET_EC2_IP:/home/ubuntu/deployment/deploy.sh"

    - |
      ssh \
        -i "$SSH_PRIVATE_KEY" \
        -o StrictHostKeyChecking=no \
        "ubuntu@$TARGET_EC2_IP" \
        "
        chmod +x /home/ubuntu/deployment/deploy.sh &&
        AWS_ACCOUNT_ID='$AWS_ACCOUNT_ID' \
        AWS_DEFAULT_REGION='$AWS_DEFAULT_REGION' \
        ECR_REPOSITORY='$ECR_REPOSITORY' \
        IMAGE_TAG='$IMAGE_TAG' \
        CONTAINER_NAME='springboot-app' \
        HOST_PORT='8080' \
        CONTAINER_PORT='8080' \
        /home/ubuntu/deployment/deploy.sh
        "

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'