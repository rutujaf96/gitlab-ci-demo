image: maven:3.9.9-eclipse-temurin-21

stages:
  - build
  - docker

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  AWS_EC2_METADATA_DISABLED: "false"
  AWS_METADATA_SERVICE_TIMEOUT: "5"
  AWS_METADATA_SERVICE_NUM_ATTEMPTS: "3"

build:
  stage: build

  tags:
    - docker

  script:
    - echo "Building Maven application..."
    - mvn clean package

  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

  cache:
    key: maven-cache
    paths:
      - .m2/repository/

docker-build-push:
  stage: docker
  image: docker:28

  tags:
    - docker

  needs:
    - job: build
      artifacts: true

  before_script:
    - apk add --no-cache aws-cli curl
    - aws --version
    - docker version

    - echo "Checking EC2 metadata..."
    - |
      TOKEN=$(curl --silent --show-error --fail \
        --request PUT \
        "http://169.254.169.254/latest/api/token" \
        --header "X-aws-ec2-metadata-token-ttl-seconds: 21600")

      ROLE_NAME=$(curl --silent --show-error --fail \
        --header "X-aws-ec2-metadata-token: $TOKEN" \
        "http://169.254.169.254/latest/meta-data/iam/security-credentials/")

      echo "IAM role detected: $ROLE_NAME"

    - echo "AWS identity:"
    - aws sts get-caller-identity

  script:
    - export ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - export ECR_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

    - echo "Building Docker image..."
    - docker build --tag "$ECR_IMAGE" .

    - echo "Logging in to Amazon ECR..."
    - |
      aws ecr get-login-password \
        --region "$AWS_DEFAULT_REGION" |
      docker login \
        --username AWS \
        --password-stdin "$ECR_REGISTRY"

    - echo "Pushing Docker image..."
    - docker push "$ECR_IMAGE"

    - echo "Successfully pushed:"
    - echo "$ECR_IMAGE"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'